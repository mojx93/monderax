<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:420},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:300,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:120,&quot;max&quot;:460,&quot;unit&quot;:&quot;px&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:264,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:100,&quot;max&quot;:420,&quot;unit&quot;:&quot;px&quot;},&quot;d&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:292,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:120,&quot;max&quot;:460,&quot;unit&quot;:&quot;px&quot;},&quot;finish&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;graphite&quot;,&quot;options&quot;:[&quot;graphite&quot;,&quot;steel&quot;,&quot;raw&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const W = Number(this.props.w ?? 300);
    const H = Number(this.props.h ?? 264);
    const D = Number(this.props.d ?? 292);
    const finish = this.props.finish ?? "graphite";
    const filters = {
      graphite: "none",
      steel: "brightness(1.5) saturate(0.72) contrast(0.96)",
      raw: "brightness(2.05) saturate(0.3) contrast(0.9)"
    };
    const face = (w, h, rot, tz) => ({
      position: "absolute",
      left: "50%",
      top: "50%",
      width: w + "px",
      height: h + "px",
      marginLeft: -w / 2 + "px",
      marginTop: -h / 2 + "px",
      transform: rot + " translateZ(" + tz + "px)",
      transformStyle: "preserve-3d",
      overflow: "hidden",
      backfaceVisibility: "hidden"
    });
    return {
      wrapStyle: {
        position: "relative",
        width: "100%",
        height: "100%",
        display: "grid",
        placeItems: "center",
        perspective: "2800px",
        filter: filters[finish] || "none"
      },
      boxStyle: {
        position: "relative",
        width: W + "px",
        height: H + "px",
        transformStyle: "preserve-3d",
        transform: "rotateX(-19deg) rotateY(-33deg)"
      },
      faceFront: face(W, H, "", D / 2),
      faceSide: face(D, H, "rotateY(90deg)", W / 2),
      faceTop: face(W, D, "rotateX(90deg)", H / 2)
    };
  }
}

</script>
