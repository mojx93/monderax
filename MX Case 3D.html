<title>MX-15 — turn it in your hand</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&amp;display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #16222e; }
  three-d-stage:not(:defined) { visibility: hidden; }
  /* Barlow, matching the site — the stage's caption and toolbar inherit it */
  body { font-family: 'Barlow', system-ui, sans-serif; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!-- The backdrop is a pool of light, not a flat fill: the object sits in the bright
     centre and the corners fall to near-black, so a black machine separates from its
     ground instead of merging with it. -->
<three-d-stage name="monderax-mx15" background="radial-gradient(120% 95% at 50% 42%, #33506b 0%, #24394d 38%, #16222e 72%, #0e1720 100%)" autorotate></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
  import { buildCase } from './mx-case-model.js';
  const stage = document.querySelector('three-d-stage');
  await stage.ready;
  stage.setObject(buildCase());
  // embedded as a hero: the download toolbar belongs on the standalone page only
  if (new URLSearchParams(location.search).has('embed')) {
    stage._toolbar && (stage._toolbar.style.display = 'none');
    // drag still turns it 360°, but the wheel must scroll the page, not zoom
    if (stage._controls) {
      stage._controls.enableZoom = false;
      stage._controls.enablePan = false;
    }
  }
</script>
</body>
</html>
