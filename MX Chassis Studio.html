<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monderax MX — chassis</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; background: #f2f2f3; }
  three-d-stage:not(:defined) { visibility: hidden; }
  #stage { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<three-d-stage id="stage" name="monderax-mx-240" background="#f2f2f3"></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
import { buildShell, buildLayers } from './mx-chassis.js';
import { buildFrame, buildFrameRow } from './mx-frame.js';
const stage = document.getElementById('stage');
const { THREE } = await stage.ready;

// Studio environment: a soft vertical gradient so the anodised surfaces and
// the machined chamfers pick up reflections instead of reading as flat black.
(() => {
  const c = document.createElement('canvas');
  c.width = 8; c.height = 256;
  const ctx = c.getContext('2d');
  const grd = ctx.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#ffffff');
  grd.addColorStop(0.42, '#d8dade');
  grd.addColorStop(0.52, '#8d9297');
  grd.addColorStop(1, '#26282b');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, 8, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(stage._renderer);
  stage._scene.environment = pmrem.fromEquirectangular(tex).texture;
  stage._scene.environmentIntensity = 0.9;
  const rim = new THREE.DirectionalLight(0xdfe6ee, 1.4);
  rim.position.set(-3.5, 2.2, 4);
  stage._scene.add(rim);
})();

const scenes = {};
scenes.single = buildShell();
scenes.exploded = (() => {
  const g = buildLayers();
  const gaps = [0.30, 0.20, 0.12, 0.02, -0.12];
  g.userData.layers.forEach((l, i) => { l.position.y = gaps[i]; });
  return g;
})();
scenes.lineup = (() => {
  const g = new THREE.Group();
  g.name = 'range';
  const specs = [[0.24, 0.17, 0.25], [0.30, 0.216, 0.30], [0.34, 0.30, 0.34]];
  let x = 0;
  specs.forEach((s, i) => {
    const c = buildShell(s[0], s[1], s[2]);
    c.position.x = x + s[0] / 2;
    c.rotation.y = -0.18;
    x += s[0] + 0.07;
    g.add(c);
  });
  g.position.x = -x / 2;
  return g;
})();

function cam(target, dir, dist, fov) {
  const c = stage._camera, ctl = stage._controls;
  c.fov = fov; c.near = 0.01; c.far = 50; c.updateProjectionMatrix();
  ctl.target.set(target[0], target[1], target[2]);
  c.position.set(
    target[0] + dir[0] * dist,
    target[1] + dir[1] * dist,
    target[2] + dir[2] * dist
  );
  ctl.update();
}

scenes.frameRow = buildFrameRow();
scenes.frameOne = buildFrame({ populated: true, brackets: true });

function card(scene, f, yaw) {
  stage.style.setProperty('--stage-bg', '#0c0d0e');
  if (yaw !== undefined) { scene.rotation.y = yaw; scene.updateMatrixWorld(true); }
  stage._camera.fov = 26;
  stage._camera.updateProjectionMatrix();
  stage.setObject(scene);
  const c = stage._camera, t = stage._controls.target;
  c.position.sub(t).multiplyScalar(f).add(t);
  stage._controls.update();
}

const views = {
  hero() {
    stage.setObject(scenes.single);
    stage.style.setProperty('--stage-bg', '#1d2d3d');
    scenes.single.rotation.y = 0;
    cam([0, 0.125, 0], norm(0.62, 0.30, 1), 1.15, 30);
  },
  heroLight() {
    stage.setObject(scenes.single);
    stage.style.setProperty('--stage-bg', '#f2f2f3');
    scenes.single.rotation.y = 0;
    cam([0, 0.125, 0], norm(0.62, 0.30, 1), 0.98, 30);
  },
  side() {
    stage.setObject(scenes.single);
    stage.style.setProperty('--stage-bg', '#f2f2f3');
    scenes.single.rotation.y = -0.20;
    cam([0, 0.125, 0], norm(1, 0.13, 0.03), 1.72, 13);
  },
  rear() {
    stage.setObject(scenes.single);
    stage.style.setProperty('--stage-bg', '#f2f2f3');
    scenes.single.rotation.y = 0;
    cam([0, 0.13, -0.17], norm(-0.40, 0.22, -1), 0.72, 30);
  },
  exploded() {
    stage.setObject(scenes.exploded);
    stage.style.setProperty('--stage-bg', '#f2f2f3');
    cam([0, 0.10, 0], norm(0.8, 0.42, 1), 1.24, 22);
  },
  frameRow() {
    stage.setObject(scenes.frameRow);
    stage.style.setProperty('--stage-bg', '#0c0d0e');
    cam([0, 0.12, 0], norm(0.62, 0.42, 1), 9.3, 9);
  },
  frameRowNavy() {
    stage.setObject(scenes.frameRow);
    stage.style.setProperty('--stage-bg', '#1d2d3d');
    cam([0, 0.12, 0], norm(0.62, 0.42, 1), 9.3, 9);
  },
  frameOne() {
    stage.setObject(scenes.frameOne);
    stage.style.setProperty('--stage-bg', '#0c0d0e');
    cam([0, 0.12, 0], norm(0.75, 0.40, 1), 1.35, 26);
  },
  cardQuarter() { card(scenes.single, 0.60, 0.28); },
  cardExploded() { card(scenes.exploded, 0.72); },
  cardFrame() { card(scenes.frameOne, 0.62, -0.15); },
  cardRange() { card(scenes.lineup, 0.66); },
  quarterDark() {
    stage.setObject(scenes.single);
    stage.style.setProperty('--stage-bg', '#0c0d0e');
    scenes.single.rotation.y = 0;
    cam([0, 0.125, 0], norm(0.62, 0.30, 1), 1.34, 30);
  },
  explodedDark() {
    stage.setObject(scenes.exploded);
    stage.style.setProperty('--stage-bg', '#0c0d0e');
    cam([0, 0.10, 0], norm(0.8, 0.42, 1), 1.85, 22);
  },
  lineupDark() {
    stage.setObject(scenes.lineup);
    stage.style.setProperty('--stage-bg', '#0c0d0e');
    cam([0, 0.15, 0], norm(0.34, 0.24, 1), 1.95, 26);
  },
  lineup() {
    stage.setObject(scenes.lineup);
    stage.style.setProperty('--stage-bg', '#1d2d3d');
    cam([0, 0.15, 0], norm(0.34, 0.24, 1), 1.60, 26);
  }
};
function norm(x, y, z) { const l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; }

window.MX = {
  view(n) { views[n](); stage._renderer.render(stage._scene, stage._camera); return n; },
  render() { stage._controls.update(); stage._renderer.render(stage._scene, stage._camera); },
  chrome(on) {
    stage.shadowRoot.childNodes.forEach((n) => {
      if (n.nodeType !== 1 || n.tagName === 'CANVAS' || n.tagName === 'STYLE') return;
      n.style.display = on ? '' : 'none';
    });
  },
  size(w, h) { stage.style.width = w + 'px'; stage.style.height = h + 'px'; }
};
views.hero();
</script>
</body>
</html>
