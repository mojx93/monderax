<x-dc>

          </g>

            <path d="M156.7 508.5 L156.7 520.5"></path><path d="M454.6 336.5 L454.6 348.5"></path><path d="M0 418 L0 430"></path>
          </g>
          <g style="{{ badge }}">
            <circle cx="-8" cy="350" r="12" stroke-opacity="0.6" stroke-width="1"></circle>

          </g>
          <g transform="matrix(-0.866,-0.5,0,-1,156.7,508.5)">
            <path d="M0 0 L181 0 L181 20 L0 20 Z" fill="#f7f7f8" fill-opacity="0.95" stroke-opacity="0.85"></path>
          </g>
          <g style="{{ badge }}">
            <circle cx="-8" cy="350" r="12" stroke-opacity="0.6" stroke-width="1"></circle>
            <text x="-8" y="354" text-anchor="middle" fill="currentColor" stroke="none" fill-opacity="0.85" font-size="12">02</text>
          </g>
        </g>

        <g style="{{ L3 }}">
          <g transform="matrix(0.866,-0.5,-0.866,-0.5,156.7,454.5)">
            <path d="M0 0 L344 0 L344 181 L0 181 Z" fill="#f7f7f8" fill-opacity="0.95" stroke-opacity="0.85"></path>
            <path d="M20 26 L324 26 L324 96 L20 96 Z" stroke-opacity="0.6"></path>
            <rect x="30" y="34" width="128" height="54" rx="6" stroke-opacity="0.5"></rect>
            <rect x="186" y="34" width="128" height="54" rx="6" stroke-opacity="0.5"></rect>
            <path d="M176 26 L168 96" stroke-opacity="0.45"></path>

          <g transform="matrix(0.866,-0.5,0,-1,156.7,508.5)">
            <path d="M0 0 L344 0 L344 54 L0 54 Z" fill="#f7f7f8" fill-opacity="0.95" stroke-opacity="0.85"></path>
            <rect x="20" y="6" width="304" height="42" stroke-opacity="0.45"></rect>
          </g>
          <g transform="matrix(-0.866,-0.5,0,-1,156.7,508.5)">
            <path d="M0 0 L181 0 L181 54 L0 54 Z" fill="#f7f7f8" fill-opacity="0.95" stroke-opacity="0.85"></path>
            <rect x="26" y="8" width="96" height="38" stroke-opacity="0.4"></rect>
          </g>
          <g style="{{ badge }}">
            <circle cx="-8" cy="350" r="12" stroke-opacity="0.6" stroke-width="1"></circle>
            <text x="-8" y="354" text-anchor="middle" fill="currentColor" stroke="none" fill-opacity="0.85" font-size="12">03</text>
          </g>
        </g>

        <g style="{{ L4 }}">
          <g transform="matrix(0.866,-0.5,-0.866,-0.5,156.7,466.5)">

            <circle cx="94" cy="61" r="30" stroke-opacity="0.55"></circle>
            <circle cx="94" cy="61" r="10" stroke-opacity="0.4"></circle>
            <g stroke-opacity="0.3"><path d="M36 32 L152 32"></path><path d="M36 40 L152 40"></path><path d="M36 82 L152 82"></path><path d="M36 90 L152 90"></path></g>

          </g>
          <g transform="matrix(0.866,-0.5,0,-1,156.7,508.5)">
            <path d="M0 0 L344 0 L344 42 L0 42 Z" fill="#f7f7f8" fill-opacity="0.95" stroke-opacity="0.85"></path>
            <g stroke-opacity="0.3"><path d="M40 6 L40 36"></path><path d="M52 6 L52 36"></path><path d="M64 6 L64 36"></path><path d="M76 6 L76 36"></path><path d="M88 6 L88 36"></path><path d="M100 6 L100 36"></path><path d="M112 6 L112 36"></path><path d="M124 6 L124 36"></path><path d="M136 6 L136 36"></path><path d="M148 6 L148 36"></path></g>
          </g>
          <g transform="matrix(-0.866,-0.5,0,-1,156.7,508.5)">
            <path d="M0 0 L181 0 L181 42 L0 42 Z" fill="#f7f7f8" fill-opacity="0.95" stroke-opacity="0.85"></path>
          </g>
          <g style="{{ badge }}">
            <circle cx="-8" cy="350" r="12" stroke-opacity="0.6" stroke-width="1"></circle>

          </g>
        </g>

        <g style="{{ L5 }}">
          <g transform="matrix(0.866,-0.5,-0.866,-0.5,156.7,500.5)">
            <path d="M0 0 L344 0 L344 181 L0 181 Z" fill="#f7f7f8" fill-opacity="0.95" stroke-opacity="0.9"></path>
            <rect x="13" y="13" width="318" height="155" fill="url(#perf-ex)" stroke-opacity="0.45"></rect>
            <g stroke-opacity="0.55">
              <circle cx="6.5" cy="6.5" r="3.2"></circle><circle cx="337.5" cy="6.5" r="3.2"></circle>
              <circle cx="6.5" cy="174.5" r="3.2"></circle><circle cx="337.5" cy="174.5" r="3.2"></circle>
            </g>
          </g>
          <g transform="matrix(0.866,-0.5,0,-1,156.7,508.5)">
            <path d="M0 0 L344 0 L344 8 L0 8 Z" fill="#f7f7f8" fill-opacity="0.95" stroke-opacity="0.9"></path>
          </g>
          <g transform="matrix(-0.866,-0.5,0,-1,156.7,508.5)">
            <path d="M0 0 L181 0 L181 8 L0 8 Z" fill="#f7f7f8" fill-opacity="0.95" stroke-opacity="0.9"></path>
          </g>
          <g style="{{ badge }}">
            <circle cx="-8" cy="350" r="12" stroke-opacity="0.6" stroke-width="1"></circle>

      </g>
    </svg>
    <div style="{{ hintStyle }}">{{ hintText }}</div>
  </div>

  <ol style="{{ listStyle }}">
    <sc-for list="{{ layers }}" as="l" hint-placeholder-count="5">
      <li style="{{ l.style }}"><span style="opacity: 0.5; font-variant-numeric: tabular-nums;">{{ l.no }}</span><span>{{ l.name }}</span></li>
    </sc-for>
  </ol>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:640},&quot;legend&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;side&quot;,&quot;options&quot;:[&quot;side&quot;,&quot;none&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };

  defs() {
    return [
      { no: "01", name: "Base and supply — Corsair SF1000L, 1000 W SFX-L", closed: 0, openAt: 0 },
      { no: "02", name: "ASUS ROG Strix X870-I with Ryzen 9 9950X", closed: 70, openAt: 150 },
      { no: "03", name: "NVIDIA RTX PRO 6000 Blackwell, 96 GB — shrouded, flow-through", closed: 90, openAt: 262 },
      { no: "04", name: "Noctua NH-L12S over the processor, 70 mm", closed: 144, openAt: 380 },
      { no: "05", name: "Top panel — perforated, magnet-held", closed: 186, openAt: 500 }
    ];
  }

  renderVals() {
    const open = this.state.open;
    const d = this.defs();
    const toggle = () => this.setState((s) => ({ open: !s.open }));
    const out = {
      open,
      toggle,
      onKey: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } },
      sceneStyle: {
        transform: open ? "translateY(119.8px) scale(0.66)" : "translateY(25.5px) scale(1.04)",
        transformOrigin: "229px 305px",
        transition: "transform 780ms cubic-bezier(0.22, 0.8, 0.22, 1)"
      },
      wrapStyle: {
        display: "grid",
        gridTemplateColumns: (this.props.legend ?? "side") === "side" ? "minmax(0, 1fr) minmax(150px, 200px)" : "minmax(0, 1fr)",
        gap: "clamp(16px, 3vw, 34px)",
        alignItems: "center",
        width: "100%"
      },
      hintText: open ? "Click to close" : "Click to open it",
      badge: { opacity: open ? 1 : 0, transition: "opacity 320ms ease " + (open ? "300ms" : "0ms") },
      hintStyle: {
        marginTop: "10px",
        fontSize: "12px",
        letterSpacing: "0.12em",
        textTransform: "uppercase",
        opacity: 0.55
      },
      listStyle: {
        listStyle: "none",
        margin: 0,
        padding: 0,
        display: "grid",
        gap: "12px",
        fontSize: "13px",
        lineHeight: 1.35
      },
      layers: d.slice().reverse().map((l, i) => ({
        no: l.no,
        name: l.name,
        style: {
          display: "grid",
          gridTemplateColumns: "3ch 1fr",
          gap: "10px",
          opacity: open ? 1 : 0.4,
          transform: open ? "translateX(0)" : "translateX(5px)",
          transition: "opacity 400ms ease " + i * 40 + "ms, transform 400ms ease " + i * 40 + "ms",
          borderBottom: "1px solid rgba(128,132,136,0.35)",
          paddingBottom: "10px"
        }
      }))
    };
    d.forEach((l, i) => {
      out["L" + (i + 1)] = {
        transform: "translateY(" + -(open ? l.openAt : l.closed) + "px)",
        transition: "transform 780ms cubic-bezier(0.22, 0.8, 0.22, 1) " + i * 50 + "ms"
      };
    });
    return out;
  }
}

</script>
</body>
</html>
